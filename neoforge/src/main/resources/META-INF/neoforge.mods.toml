modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "MIT License"

[[mods]]
modId = "${archives_name}"
version = "${version}"
displayName = "${mod_name}"
authors = "Lunatrius, EmilyTheGrate"
description = '''
A collection of utilities for Lunatrius' mods.
'''
#logoFile = ""

[[dependencies.${ archives_name }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ archives_name }]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ archives_name }]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "lunatriuscore.mixins.json"